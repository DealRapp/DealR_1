name: CI/CD - Poker Social

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: poker
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        project: [backend, frontend, mobile]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: npm
        cache-dependency-path: ${{ matrix.project }}/package-lock.json

    - name: Install dependencies
      run: |
        cd ${{ matrix.project }}
        npm ci

    - name: Run checks
      run: |
        cd ${{ matrix.project }}
        npm run lint || echo "No lint script, skipping..."
        npm test || echo "No test script, skipping..."

    - name: Build project
      run: |
        cd ${{ matrix.project }}
        npm run build || echo "No build script, skipping..."

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - uses: akhileshns/heroku-deploy@v3.12.12
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: "poker-social-backend"
        heroku_email: "ton-email@example.com"
        appdir: "backend"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend

  push-docker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push backend
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/poker-backend ./backend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/poker-backend

    - name: Build and push frontend
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/poker-frontend ./frontend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/poker-frontend

    - name: Build and push mobile
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/poker-mobile ./mobile
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/poker-mobile
